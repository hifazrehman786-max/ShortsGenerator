name: Generate Test Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create .env File
        run: |
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" >> .env
          echo "IMAGEMAGICK_BINARY=/usr/bin/convert" >> .env

      - name: Run Short Generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python -c "
          import sys
          sys.path.append('Backend')
          from gpt import generate_script
          from search import search_get_ подходя video # fallback
          print('Imports checked successfully!')
          " || python Backend/main.py &
          sleep 5
          curl -X POST http://127.0.0.1:8080/generate -H "Content-Type: application/json" -d '{"topic": "Interesting Facts"}' || true

      - name: Save Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/
