name: Generate Automated Short Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video ka topic/prompt likhein (e.g. Space Facts, Mindset Tips)'
        required: false
        default: 'Interesting Facts'
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      # 1. Code Repository Checkout
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Python Environment Setup
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. System Dependencies Install (FFmpeg & ImageMagick)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      # 4. Python Requirements Install
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f Backend/requirements.txt ]; then pip install -r Backend/requirements.txt; fi

      # 5. Dynamic Topic ke sath Video Generate Karein
      - name: Run Video Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python Backend/main.py --cli --prompt "${{ github.event.inputs.prompt }}"

      # 6. Generated Video ko Artifact ke tor par Upload Karein (Download ke liye)
      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: Backend/static/generated_videos/*.mp4
          if-no-files-found: warn
