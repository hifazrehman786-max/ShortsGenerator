name: Generate Test Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ImageMagick and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f Backend/requirements.txt ]; then pip install -r Backend/requirements.txt; fi

      - name: Create .env File
        run: |
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "PEXELS_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }}" >> .env
          echo "IMAGEMAGICK_BINARY=/usr/bin/convert" >> .env

      - name: Run Short Generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          cd Backend
          python main.py --cli

      - name: Save Generated Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-HD-Video
          path: Backend/static/generated_videos/*.mp4
          if-no-files-found: error
