name: Generate Automated Short Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video ka topic/prompt likhein (e.g. Space Facts, Mindset Tips)'
        required: false
        default: 'Interesting Facts'
        type: string

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      # 1. Code Repository Checkout
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Python Environment Setup
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. System Dependencies Install (FFmpeg & ImageMagick)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      # 4. Python Requirements Install
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f Backend/requirements.txt ]; then pip install -r Backend/requirements.txt; fi

      # 5. Run Video Generator
      - name: Run Video Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || '' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || '' }}
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          PROMPT_INPUT="${{ github.event.inputs.prompt }}"
          if [ -z "$PROMPT_INPUT" ]; then
            PROMPT_INPUT="Interesting Facts"
          fi
          
          python Backend/main.py --cli --prompt "$PROMPT_INPUT"

      # 6. Upload Generated Video
      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            **/*.mp4
          if-no-files-found: warn
